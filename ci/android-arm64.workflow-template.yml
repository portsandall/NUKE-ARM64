name: ARM64 bootstrap
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned KisakBlack sources
        uses: actions/checkout@v4
        with:
          repository: SwagSoftware/KisakBlack
          ref: 306bb14a8e052a6244bd1df4e4df7d8504c04ef4
          path: upstream/KisakBlack
      - name: Configure with Android NDK
        run: |
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DNUKE_KISAKBLACK_ROOT="$GITHUB_WORKSPACE/upstream/KisakBlack"
      - name: Compile AArch64 probe
        run: cmake --build build/android --verbose
      - name: Verify ELF architecture
        run: |
          file build/android/nuke-platform-probe
          llvm-readelf -h build/android/nuke-platform-probe | grep -E 'Class:|Machine:'
          llvm-readelf -h build/android/nuke-platform-probe | grep -q 'AArch64'
      - uses: actions/upload-artifact@v4
        with:
          name: nuke-android-aarch64-probe
          path: build/android/nuke-platform-probe
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure
