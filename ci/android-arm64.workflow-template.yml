name: ARM64 bootstrap
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure with Android NDK
        run: |
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile AArch64 smoke binaries
        run: cmake --build build/android --verbose
      - name: Verify ELF architecture
        run: |
          for binary in nuke-platform-probe nuke-atomic-test; do
            path="build/android/$binary"
            file "$path"
            header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$path")"
            printf '%s\n' "$header" | grep -E 'Class:|Machine:'
            grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected ELF64 output: $path" >&2; exit 1; }
            grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected AArch64 machine: $path" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v6
        with:
          name: nuke-android-aarch64-smoke-binaries
          path: |
            build/android/nuke-platform-probe
            build/android/nuke-atomic-test
  upstream-patch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout pinned KisakBlack source
        uses: actions/checkout@v5
        with:
          repository: SwagSoftware/KisakBlack
          ref: 306bb14a8e052a6244bd1df4e4df7d8504c04ef4
          path: build/upstream
          persist-credentials: false
      - name: Verify portability patches apply cleanly
        run: |
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/0001-fix-aarch64-bitarray-varargs.patch"
          git -C build/upstream apply "$GITHUB_WORKSPACE/patches/0001-fix-aarch64-bitarray-varargs.patch"
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/0002-port-physics-win32-atomics.patch"
          git -C build/upstream apply "$GITHUB_WORKSPACE/patches/0002-port-physics-win32-atomics.patch"
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/0003-port-threading-win32-apis.patch"
          git -C build/upstream apply "$GITHUB_WORKSPACE/patches/0003-port-threading-win32-apis.patch"
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/0004-posix-random-name.patch"
          git -C build/upstream apply "$GITHUB_WORKSPACE/patches/0004-posix-random-name.patch"
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/0005-fix-angle-axis-row-index.patch"
          git -C build/upstream apply "$GITHUB_WORKSPACE/patches/0005-fix-angle-axis-row-index.patch"
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/0006-fix-axis-to-quat-row-index.patch"
          git -C build/upstream apply "$GITHUB_WORKSPACE/patches/0006-fix-axis-to-quat-row-index.patch"
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/0007-port-com-fileaccess-errno.patch"
          git -C build/upstream apply "$GITHUB_WORKSPACE/patches/0007-port-com-fileaccess-errno.patch"
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/0008-fix-lp64-header-guards.patch"
          git -C build/upstream apply "$GITHUB_WORKSPACE/patches/0008-fix-lp64-header-guards.patch"
          git -C build/upstream apply --ignore-whitespace --check "$GITHUB_WORKSPACE/patches/0009-gate-msvc-only-cmake-flags.patch"
          git -C build/upstream apply --ignore-whitespace "$GITHUB_WORKSPACE/patches/0009-gate-msvc-only-cmake-flags.patch"
          git -C build/upstream apply --ignore-whitespace --check "$GITHUB_WORKSPACE/patches/0010-gate-win32-only-cmake-properties.patch"
          git -C build/upstream apply --ignore-whitespace "$GITHUB_WORKSPACE/patches/0010-gate-win32-only-cmake-properties.patch"
          git -C build/upstream apply --ignore-whitespace --check "$GITHUB_WORKSPACE/patches/0011-gate-win32-only-cmake-defines.patch"
          git -C build/upstream apply --ignore-whitespace "$GITHUB_WORKSPACE/patches/0011-gate-win32-only-cmake-defines.patch"
          git -C build/upstream apply --ignore-whitespace --check "$GITHUB_WORKSPACE/patches/0012-gate-directx-sdk-paths.patch"
          git -C build/upstream apply --ignore-whitespace "$GITHUB_WORKSPACE/patches/0012-gate-directx-sdk-paths.patch"
          git -C build/upstream apply --ignore-whitespace --check "$GITHUB_WORKSPACE/patches/0013-port-demonware-bdreference-android-atomics.patch"
          git -C build/upstream apply --ignore-whitespace "$GITHUB_WORKSPACE/patches/0013-port-demonware-bdreference-android-atomics.patch"
          git -C build/upstream apply --ignore-whitespace --check "$GITHUB_WORKSPACE/patches/0014-fix-bdbytebuffer-lp64-pointer-arithmetic.patch"
          git -C build/upstream apply --ignore-whitespace "$GITHUB_WORKSPACE/patches/0014-fix-bdbytebuffer-lp64-pointer-arithmetic.patch"
          python3 "$GITHUB_WORKSPACE/tests/port_bd_cypher3des.py" "$GITHUB_WORKSPACE/build/upstream/DemonWare/bdCore/bdCrypto/bdCypher3Des.cpp"
          ! grep -Fq 'static void des3_done' build/upstream/DemonWare/bdCore/bdCrypto/bdCypher3Des.cpp
          python3 "$GITHUB_WORKSPACE/tests/port_bd_platform_mutex.py" "$GITHUB_WORKSPACE/build/upstream/DemonWare/bdPlatform/bdPlatformThread/bdPlatformMutex.cpp"
          python3 "$GITHUB_WORKSPACE/tests/port_cubemap_types_case.py" "$GITHUB_WORKSPACE/build/upstream/src/CubeMapGenLib/VectorMacros.h"
          python3 "$GITHUB_WORKSPACE/tests/split_xaudio2_dsp_types.py" "$GITHUB_WORKSPACE/build/upstream"
          python3 "$GITHUB_WORKSPACE/tests/port_variadic_iassert.py" "$GITHUB_WORKSPACE/build/upstream/src/universal/assertive.h"
          python3 "$GITHUB_WORKSPACE/tests/gate_upstream_android_d3d_sources.py" "$GITHUB_WORKSPACE/build/upstream/cmake_files.cmake"
          python3 "$GITHUB_WORKSPACE/tests/decouple_fxprimitives_material_header.py" "$GITHUB_WORKSPACE/build/upstream/src/gfx_d3d/fxprimitives.h"
          python3 "$GITHUB_WORKSPACE/tests/remove_unused_bdaddr_server_include.py" "$GITHUB_WORKSPACE/build/upstream/DemonWare/bdCore/bdSocket/bdAddr.h"
          python3 "$GITHUB_WORKSPACE/tests/fix_bd_addr_socket_and_array_new_headers.py" "$GITHUB_WORKSPACE/build/upstream/DemonWare/bdCore/bdSocket/bdAddr.h" "$GITHUB_WORKSPACE/build/upstream/DemonWare/bdCore/bdContainers/bdArray.h"
          python3 "$GITHUB_WORKSPACE/tests/fix_bd_array_lp64_returns.py" "$GITHUB_WORKSPACE/build/upstream/DemonWare/bdCore/bdContainers/bdArray.h"
          python3 "$GITHUB_WORKSPACE/tests/port_chull_lp64.py" "$GITHUB_WORKSPACE/build/upstream/src/physics/phys_local.h" "$GITHUB_WORKSPACE/build/upstream/src/physics/phys_convex_hull.cpp"
          python3 "$GITHUB_WORKSPACE/tests/add_phys_local_stddef_include.py" "$GITHUB_WORKSPACE/build/upstream/src/physics/phys_local.h"
          python3 "$GITHUB_WORKSPACE/tests/port_phys_memory_lp64.py" "$GITHUB_WORKSPACE/build/upstream"
          python3 "$GITHUB_WORKSPACE/tests/port_gjk_runtime_layouts_lp64.py" "$GITHUB_WORKSPACE/build/upstream/src/physics/phys_colgeom.h"
          python3 "$GITHUB_WORKSPACE/tests/port_destructible_auto_activate_lp64.py" "$GITHUB_WORKSPACE/build/upstream/src/physics/phys_gjk_collision_detection.h" "$GITHUB_WORKSPACE/build/upstream-auto-activate-layout-fixture.hpp"
          python3 "$GITHUB_WORKSPACE/tests/port_phys_collision_pair_lp64.py" "$GITHUB_WORKSPACE/build/upstream/src/physics/rigid_body.h" "$GITHUB_WORKSPACE/build/upstream-phys-collision-pair-layout-fixture.hpp"
          python3 "$GITHUB_WORKSPACE/tests/port_gjk_cache_lp64.py" "$GITHUB_WORKSPACE/build/upstream"
          python3 "$GITHUB_WORKSPACE/tests/port_snapfloat_rounding.py" "$GITHUB_WORKSPACE/build/upstream/src/qcommon/common.h"
          python3 "$GITHUB_WORKSPACE/tests/drop_unused_phys_traverse_d3d_include.py" "$GITHUB_WORKSPACE/build/upstream/src/physics/phys_traverse.h"
          python3 "$GITHUB_WORKSPACE/tests/add_cm_trace_string_include.py" "$GITHUB_WORKSPACE/build/upstream/src/qcommon/cm_trace.h"
          python3 "$GITHUB_WORKSPACE/tests/gate_upstream_windows_links.py" "$GITHUB_WORKSPACE/build/upstream/CMakeLists.txt"
          grep -B1 -F 'WIN32_EXECUTABLE TRUE' build/upstream/CMakeLists.txt | grep -Fq 'if(WIN32)'
          grep -B3 -F 'VS_DEBUGGER_WORKING_DIRECTORY' build/upstream/CMakeLists.txt | grep -Fq 'if(MSVC AND WIN32)'
          grep -Fq 'if(MSVC)' build/upstream/CMakeLists.txt
          grep -Fq 'if(MSVC AND WIN32 AND CMAKE_SIZEOF_VOID_P EQUAL 4)' build/upstream/CMakeLists.txt
          grep -Fq 'if(MSVC AND WIN32)' build/upstream/CMakeLists.txt
          python3 - <<'PY'
          from pathlib import Path
          import re

          text = Path("build/upstream/CMakeLists.txt").read_text()
          block = text.split("# ----- Preprocessor Defines -----", 1)[1].split("# Debug-only", 1)[0]
          assert re.search(
              r"target_compile_definitions\(KisakBlack PUBLIC\s+KISAK_MP\s*\)",
              block,
          ), "KISAK_MP must remain a common definition"
          assert re.search(
              r"if\(WIN32\)\s*target_compile_definitions\(KisakBlack PUBLIC\s+WIN32\s+_CONSOLE\s+_CRT_SECURE_NO_WARNINGS\s+_WINSOCK_NO_DEPRECATED_NO_WARNINGS\s*\)\s*endif\(\)",
              block,
              re.S,
          ), "Windows-only compile definitions must be gated by if(WIN32)"
          print("Verified KISAK_MP remains common and Windows-only definitions are guarded")
          PY
          python3 - <<'PY'
          from pathlib import Path

          lines = Path("build/upstream/CMakeLists.txt").read_text().splitlines()
          dx_paths = [
              i for i, line in enumerate(lines)
              if "Microsoft DirectX SDK (June 2010)" in line
          ]
          assert len(dx_paths) == 2, f"expected two DirectX SDK paths, found {len(dx_paths)}"
          for i in dx_paths:
              assert lines[i - 1].strip() == "if(WIN32)", f"DirectX SDK path is not Windows-gated at line {i + 1}"
              assert lines[i + 1].strip() == "endif()", f"DirectX SDK path guard is malformed at line {i + 1}"
          print("Verified DirectX SDK include and x86 library paths are Windows-only")
          PY
          python3 - <<'PY'
          from pathlib import Path

          lines = Path("build/upstream/CMakeLists.txt").read_text().splitlines()
          vendor_markers = (
              'target_link_directories(KisakBlack PUBLIC "${CMAKE_CURRENT_SOURCE_DIR}/src/steam/redistributable_bin")',
              'target_link_directories(KisakBlack PUBLIC "${CMAKE_CURRENT_SOURCE_DIR}/src/binklib")',
              'target_link_directories(KisakBlack PUBLIC "${CMAKE_CURRENT_SOURCE_DIR}/src/nvapi")',
          )
          indexes = [[i for i, line in enumerate(lines) if marker in line] for marker in vendor_markers]
          assert all(len(found) == 1 for found in indexes), "expected exactly three Windows vendor path entries"
          first = indexes[0][0]
          assert lines[first - 1].strip() == "if(WIN32)", "vendor link directories must begin under if(WIN32)"
          assert [lines[first + j].strip() for j in range(3)] == [m.strip() for m in vendor_markers], "vendor path block order/content changed"
          assert lines[first + 3].strip() == "endif()", "vendor link-directory guard must close"

          link_start = lines.index("# ----- Links -----") + 1
          end_candidates = [i for i in range(link_start, len(lines)) if lines[i].strip() == "if(MSVC AND WIN32 AND CMAKE_SIZEOF_VOID_P EQUAL 4)"]
          assert end_candidates, "expected following MSVC-only 32-bit linker guard"
          links = "\n".join(lines[link_start:end_candidates[0]])
          assert lines[link_start].strip() == "if(WIN32)", "Windows import-library links must start under if(WIN32)"
          assert links.rstrip().endswith("endif()"), "Windows library guard must close before compiler-specific linker flags"
          for library in (
              "steam_api.lib", "binkw32.lib", "nvapi.lib", "d3d9.lib",
              "ws2_32.lib", "dxguid.lib", "dsound.lib", "winmm.lib",
              "xinput.lib", "xapobase.lib", "dxerr.lib", "libvpx.lib",
              "legacy_stdio_definitions.lib", "d3dx9d.lib", "d3dx9.lib",
          ):
              assert library in links, f"Expected Windows library missing from guarded block: {library}"
          print("Verified Windows vendor paths and import-library links are gated")
          PY
          test -f build/upstream/src/nuke/win_thread_compat.h
          grep -q '#include <nuke/win_thread_compat.h>' build/upstream/tl/base/tl_thread.h
          grep -q 'inline std::uint32_t GetCurrentThreadId' build/upstream/src/nuke/win_thread_compat.h
          grep -q 'inline int SwitchToThread' build/upstream/src/nuke/win_thread_compat.h
          test -f build/upstream/src/nuke/win_atomic_compat.h
          grep -q '#include <nuke/win_atomic_compat.h>' build/upstream/src/physics/phys_local.h
          grep -q 'inline LONG _InterlockedExchangeAdd' build/upstream/src/nuke/win_atomic_compat.h
          grep -q 'inline LONGLONG _InterlockedCompareExchange64' build/upstream/src/nuke/win_atomic_compat.h
          grep -q 'inline LONG _InterlockedDecrement' build/upstream/src/nuke/win_atomic_compat.h
          grep -q 'inline LONG InterlockedExchange(' build/upstream/src/nuke/win_atomic_compat.h
          grep -q 'double __cdecl Com_Random();' build/upstream/src/universal/com_math.h
          grep -q '#define random Com_Random' build/upstream/src/universal/com_math.h
          grep -Fq 'right[0] = axis[1][0];' build/upstream/src/universal/com_math_anglevectors.cpp
          grep -Fq 'right[1] = axis[1][1];' build/upstream/src/universal/com_math_anglevectors.cpp
          grep -Fq 'right[2] = axis[1][2];' build/upstream/src/universal/com_math_anglevectors.cpp
          grep -Fq 'test[0][0] = (float)mat[1][2]' build/upstream/src/universal/com_math.cpp
          grep -Fq 'test[0][0] = (float)mat[1][2]' build/upstream/src/ik/ik_math.cpp
      - name: Compile and run patched bitarray regression
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I "$GITHUB_WORKSPACE/tests/upstream-stubs" \
            -I "$GITHUB_WORKSPACE/build/upstream/src" \
            "$GITHUB_WORKSPACE/tests/upstream_bitarray.cpp" \
            -o build/upstream-bitarray-host
          ./build/upstream-bitarray-host
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++17 -Wall -Wextra -Werror \
            -I "$GITHUB_WORKSPACE/tests/upstream-stubs" \
            -I "$GITHUB_WORKSPACE/build/upstream/src" \
            "$GITHUB_WORKSPACE/tests/upstream_bitarray.cpp" \
            -o build/upstream-bitarray-android
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-bitarray-android)"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected patched bitarray test to be ELF64" >&2; exit 1; }
          grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected patched bitarray test to be AArch64" >&2; exit 1; }
      - name: Compile and run patched atomic regression
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -I "$GITHUB_WORKSPACE/build/upstream/src" \
            "$GITHUB_WORKSPACE/tests/atomic_compat.cpp" \
            -o build/upstream-atomic-host
          ./build/upstream-atomic-host
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++17 -Wall -Wextra -Werror -pthread \
            -I "$GITHUB_WORKSPACE/build/upstream/src" \
            "$GITHUB_WORKSPACE/tests/atomic_compat.cpp" \
            -o build/upstream-atomic-android
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-atomic-android)"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected patched atomic test to be ELF64" >&2; exit 1; }
          grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected patched atomic test to be AArch64" >&2; exit 1; }
      - name: Compile and run DemonWare reference-count regression
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I "$GITHUB_WORKSPACE/build/upstream" \
            -I "$GITHUB_WORKSPACE/build/upstream/src" \
            "$GITHUB_WORKSPACE/tests/upstream_bd_referencable.cpp" \
            -o build/upstream-bd-reference-host
          ./build/upstream-bd-reference-host
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++17 -Wall -Wextra -Werror \
            -I "$GITHUB_WORKSPACE/build/upstream" \
            -I "$GITHUB_WORKSPACE/build/upstream/src" \
            "$GITHUB_WORKSPACE/tests/upstream_bd_referencable.cpp" \
            -o build/upstream-bd-reference-android
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-bd-reference-android)"
          printf '%s\\n' "$header" | grep -E 'Class:|Machine:'
          grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected DemonWare reference test to be ELF64" >&2; exit 1; }
          grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected DemonWare reference test to be AArch64" >&2; exit 1; }
      - name: Compile and run DemonWare bounded-string length regression
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -I build/upstream/src \
            tests/upstream_bd_bytebuffer_length.cpp \
            -o build/upstream-bd-bytebuffer-length-host
          ./build/upstream-bd-bytebuffer-length-host
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++17 -Wall -Wextra -Werror -I build/upstream/src \
            tests/upstream_bd_bytebuffer_length.cpp \
            -o build/upstream-bd-bytebuffer-length-android
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$readelf" -h build/upstream-bd-bytebuffer-length-android | grep -Eq 'Class:[[:space:]]+ELF64'
          "$readelf" -h build/upstream-bd-bytebuffer-length-android | grep -Eq 'Machine:[[:space:]]+AArch64'
      - name: Compile and run POSIX DemonWare mutex regression
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread -I build/upstream \
            tests/upstream_bd_platform_mutex.cpp \
            build/upstream/DemonWare/bdPlatform/bdPlatformThread/bdPlatformMutex.cpp \
            -o build/upstream-bd-platform-mutex-host
          ./build/upstream-bd-platform-mutex-host
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++17 -Wall -Wextra -Werror -pthread -I build/upstream \
            tests/upstream_bd_platform_mutex.cpp \
            build/upstream/DemonWare/bdPlatform/bdPlatformThread/bdPlatformMutex.cpp \
            -o build/upstream-bd-platform-mutex-android
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$readelf" -h build/upstream-bd-platform-mutex-android | grep -Eq 'Class:[[:space:]]+ELF64'
          "$readelf" -h build/upstream-bd-platform-mutex-android | grep -Eq 'Machine:[[:space:]]+AArch64'
      - name: Compile and run SnapFloat rounding regression on host and Android
        run: |
          common=(
            -std=c++17 -frounding-math -Wall -Wextra -Werror
            -I "$GITHUB_WORKSPACE/build/upstream/src"
          )
          c++ "${common[@]}" "$GITHUB_WORKSPACE/tests/upstream_snapfloat_rounding.cpp" -o build/upstream-snapfloat-rounding-host
          ./build/upstream-snapfloat-rounding-host
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" "${common[@]}" "$GITHUB_WORKSPACE/tests/upstream_snapfloat_rounding.cpp" -o build/upstream-snapfloat-rounding-android
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$readelf" -h build/upstream-snapfloat-rounding-android | grep -Eq 'Class:[[:space:]]+ELF64'
          "$readelf" -h build/upstream-snapfloat-rounding-android | grep -Eq 'Machine:[[:space:]]+AArch64'
      - name: Configure upstream threading host target
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B build/upstream-thread-host-cmake -G Ninja \
            -DNUKE_BUILD_UPSTREAM_THREAD_COMPAT_TEST=ON \
            -DNUKE_UPSTREAM_SOURCE_DIR="$GITHUB_WORKSPACE/build/upstream" \
            -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build and run upstream threading host regression
        run: |
          cmake --build build/upstream-thread-host-cmake --target nuke-upstream-thread-compat-test --verbose
          ctest --test-dir build/upstream-thread-host-cmake -R '^upstream-thread-compat$' --output-on-failure
      - name: Configure upstream threading Android target
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B build/upstream-thread-android-cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DNUKE_BUILD_UPSTREAM_THREAD_COMPAT_TEST=ON \
            -DNUKE_UPSTREAM_SOURCE_DIR="$GITHUB_WORKSPACE/build/upstream" \
            -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Compile and verify upstream threading Android target
        run: |
          cmake --build build/upstream-thread-android-cmake --target nuke-upstream-thread-compat-test --verbose
          path="build/upstream-thread-android-cmake/nuke-upstream-thread-compat-test"
          test -x "$path"
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$path")"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected upstream threading regression to be ELF64" >&2; exit 1; }
          grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected upstream threading regression to be AArch64" >&2; exit 1; }
      - name: Configure upstream Base64 host target
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B build/upstream-base64-host -G Ninja \
            -DNUKE_BUILD_UPSTREAM_BASE64_TEST=ON \
            -DNUKE_UPSTREAM_SOURCE_DIR="$GITHUB_WORKSPACE/build/upstream" \
            -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build and run upstream Base64 host target
        run: |
          cmake --build build/upstream-base64-host --target nuke-upstream-base64-test
          ctest --test-dir build/upstream-base64-host -R '^upstream-base64-roundtrip$' --output-on-failure
      - name: Configure upstream Base64 Android target
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B build/upstream-base64-android-cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DNUKE_BUILD_UPSTREAM_BASE64_TEST=ON \
            -DNUKE_UPSTREAM_SOURCE_DIR="$GITHUB_WORKSPACE/build/upstream" \
            -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build and verify upstream Base64 Android target
        run: |
          cmake --build build/upstream-base64-android-cmake --target nuke-upstream-base64-test
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-base64-android-cmake/nuke-upstream-base64-test)"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected upstream Base64 regression to be ELF64" >&2; exit 1; }
          grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected upstream Base64 regression to be AArch64" >&2; exit 1; }
      - name: Configure upstream angle/vector host target
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B build/upstream-angle-host -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DNUKE_BUILD_UPSTREAM_ANGLE_VECTORS=ON \
            -DNUKE_UPSTREAM_SOURCE_DIR="$GITHUB_WORKSPACE/build/upstream" \
            -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Compile upstream angle/vector and quaternion host objects
        run: cmake --build build/upstream-angle-host --target nuke-upstream-angle-vectors nuke-upstream-axis-to-quat --verbose
      - name: Configure upstream angle/vector Android target
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B build/upstream-angle-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DNUKE_BUILD_UPSTREAM_ANGLE_VECTORS=ON \
            -DNUKE_BUILD_UPSTREAM_FILEACCESS_TEST=ON \
            -DNUKE_UPSTREAM_SOURCE_DIR="$GITHUB_WORKSPACE/build/upstream" \
            -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Compile and link upstream angle/vector Android smoke test
        run: |
          cmake --build build/upstream-angle-android --target nuke-upstream-angle-vectors nuke-upstream-axis-to-quat nuke-upstream-angle-vectors-test nuke-upstream-fileaccess-test --verbose
          for target in nuke-upstream-angle-vectors nuke-upstream-axis-to-quat; do
            object="$(find "build/upstream-angle-android/CMakeFiles/$target.dir" -name '*.o' -print -quit)"
            test -n "$object"
            output="build/$target-android.o"
            cp "$object" "$output"
            header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$output")"
            printf '%s\n' "$header" | grep -E 'Class:|Machine:'
            grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected $target object to be ELF64" >&2; exit 1; }
            grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected $target object to be AArch64" >&2; exit 1; }
          done
          executable="build/upstream-angle-android/nuke-upstream-angle-vectors-test"
          test -x "$executable"
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$executable")"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected linked angle/vector smoke test to be ELF64" >&2; exit 1; }
          grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected linked angle/vector smoke test to be AArch64" >&2; exit 1; }
          fileaccess="build/upstream-angle-android/nuke-upstream-fileaccess-test"
          test -x "$fileaccess"
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$fileaccess")"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected upstream file-access executable to be ELF64" >&2; exit 1; }
          grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected upstream file-access executable to be AArch64" >&2; exit 1; }
      - name: Compile MSVC-style upstream headers with Android Clang extensions
        run: |
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -fdeclspec -include "$GITHUB_WORKSPACE/tests/upstream_msvc_compat.h" -Wall -Wextra \
            -I "$GITHUB_WORKSPACE/build/upstream" \
            -I "$GITHUB_WORKSPACE/build/upstream/src" \
            -c "$GITHUB_WORKSPACE/tests/upstream_msvc_extensions.cpp" \
            -o build/upstream-msvc-extensions-android.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-msvc-extensions-android.o
      - name: Compile and run LP64 physics allocator regression on host and Android
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -I "$GITHUB_WORKSPACE/tests" \
            "$GITHUB_WORKSPACE/tests/upstream_phys_buffer_allocator.cpp" \
            -o build/upstream-phys-buffer-allocator-host
          ./build/upstream-phys-buffer-allocator-host
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++17 -Wall -Wextra -Werror -pthread \
            -I "$GITHUB_WORKSPACE/tests" \
            "$GITHUB_WORKSPACE/tests/upstream_phys_buffer_allocator.cpp" \
            -o build/upstream-phys-buffer-allocator-android
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          "$readelf" -h build/upstream-phys-buffer-allocator-android | grep -Eq 'Class:[[:space:]]+ELF64'
          "$readelf" -h build/upstream-phys-buffer-allocator-android | grep -Eq 'Machine:[[:space:]]+AArch64'
      - name: Compile patched physics memory manager on host and Android
        run: |
          common=(
            -std=c++20 -fdeclspec
            -include "$GITHUB_WORKSPACE/tests/upstream_msvc_compat.h"
            -I "$GITHUB_WORKSPACE/build/upstream"
            -I "$GITHUB_WORKSPACE/build/upstream/src"
          )
          clang++ "${common[@]}" -Wall -Wextra -Wno-ignored-attributes \
            -c "$GITHUB_WORKSPACE/build/upstream/src/physics/phys_mem_new.cpp" \
            -o build/upstream-phys-mem-new-host.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            "${common[@]}" -Wall -Wextra -Wno-ignored-attributes \
            -c "$GITHUB_WORKSPACE/build/upstream/src/physics/phys_mem_new.cpp" \
            -o build/upstream-phys-mem-new-android.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h build/upstream-phys-mem-new-android.o | grep -Eq 'Class:[[:space:]]+ELF64'
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h build/upstream-phys-mem-new-android.o | grep -Eq 'Machine:[[:space:]]+AArch64'
      - name: Compile CubeMapGen bounding-box headers on host and Android
        run: |
          c++ -std=c++20 '-D__int64=long long' \
            -I build/upstream -I build/upstream/src \
            -c tests/upstream_cubemap_headers.cpp \
            -o build/upstream-cubemap-headers-host.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++20 -fdeclspec \
            -include "$GITHUB_WORKSPACE/tests/upstream_msvc_compat.h" \
            -I build/upstream -I build/upstream/src \
            -c tests/upstream_cubemap_headers.cpp \
            -o build/upstream-cubemap-headers-android.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-cubemap-headers-android.o | grep -Eq 'Class:[[:space:]]+ELF64'
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-cubemap-headers-android.o | grep -Eq 'Machine:[[:space:]]+AArch64'
      - name: Compile generic sound DSP headers and validate layouts on host and Android
        run: |
          common=(
            -std=c++20 -fdeclspec
            -include "$GITHUB_WORKSPACE/tests/upstream_msvc_compat.h"
            -I build/upstream -I build/upstream/src
          )
          clang++ "${common[@]}" -Wall -Wextra \
            -c tests/upstream_snd_dsp_types.cpp \
            -o build/upstream-snd-dsp-types-host.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            "${common[@]}" -Wall -Wextra \
            -c tests/upstream_snd_dsp_types.cpp \
            -o build/upstream-snd-dsp-types-android.o
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-snd-dsp-types-android.o)"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          printf '%s\n' "$header" | grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$'
          printf '%s\n' "$header" | grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$'
      - name: Compile FX primitive declarations without D3D9 coupling
        run: |
          common=(
            -std=c++20 -fdeclspec
            -include "$GITHUB_WORKSPACE/tests/upstream_msvc_compat.h"
            -I build/upstream -I build/upstream/src
          )
          clang++ "${common[@]}" -Wall -Wextra -Wno-ignored-attributes -c tests/upstream_fxprimitives_header.cpp -o build/upstream-fxprimitives-host.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" "${common[@]}" -Wall -Wextra -Wno-ignored-attributes -c tests/upstream_fxprimitives_header.cpp -o build/upstream-fxprimitives-android.o
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-fxprimitives-android.o)"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          printf '%s\n' "$header" | grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$'
          printf '%s\n' "$header" | grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$'
      - name: Compile and verify native LP64 GJK runtime layouts on host and Android
        run: |
          common=(
            -std=c++20 -fdeclspec -Wall -Wextra -Wno-ignored-attributes
            -include "$GITHUB_WORKSPACE/tests/upstream_msvc_compat.h"
            -I "$GITHUB_WORKSPACE/build/upstream"
            -I "$GITHUB_WORKSPACE/build/upstream/src"
          )
          clang++ "${common[@]}" -c "$GITHUB_WORKSPACE/tests/upstream_gjk_runtime_layout.cpp" -o build/upstream-gjk-runtime-layout-host.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" "${common[@]}" -c "$GITHUB_WORKSPACE/tests/upstream_gjk_runtime_layout.cpp" -o build/upstream-gjk-runtime-layout-android.o
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-gjk-runtime-layout-android.o)"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          printf '%s\n' "$header" | grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$'
          printf '%s\n' "$header" | grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$'
      - name: Compile and verify LP64 auto-activation callback layouts on host and Android
        run: |
          common=(
            -std=c++20 -Wall -Wextra
            -I "$GITHUB_WORKSPACE/build"
          )
          clang++ "${common[@]}" -c tests/upstream_auto_activate_layout.cpp -o build/upstream-auto-activate-layout-host.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" "${common[@]}" -c tests/upstream_auto_activate_layout.cpp -o build/upstream-auto-activate-layout-android.o
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-auto-activate-layout-android.o)"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          printf '%s\n' "$header" | grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$'
          printf '%s\n' "$header" | grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$'
      - name: Compile and verify LP64 physics collision-pair layout on host and Android
        run: |
          common=(
            -std=c++20 -fdeclspec -Wall -Wextra -Wno-ignored-attributes
            -include "$GITHUB_WORKSPACE/tests/upstream_msvc_compat.h"
            -I "$GITHUB_WORKSPACE/build"
            -I "$GITHUB_WORKSPACE/build/upstream"
            -I "$GITHUB_WORKSPACE/build/upstream/src"
          )
          clang++ "${common[@]}" -c tests/upstream_phys_collision_pair_layout.cpp -o build/upstream-phys-collision-pair-layout-host.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" "${common[@]}" -c tests/upstream_phys_collision_pair_layout.cpp -o build/upstream-phys-collision-pair-layout-android.o
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-phys-collision-pair-layout-android.o)"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          printf '%s\n' "$header" | grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$'
          printf '%s\n' "$header" | grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$'
      - name: Compile LP64 GJK cache-node layout on host and Android
        run: |
          common=(
            -std=c++20 -fdeclspec -Wall -Wextra -Wno-ignored-attributes
            -include "$GITHUB_WORKSPACE/tests/upstream_msvc_compat.h"
            -I "$GITHUB_WORKSPACE/build/upstream"
            -I "$GITHUB_WORKSPACE/build/upstream/src"
          )
          clang++ "${common[@]}" -c "$GITHUB_WORKSPACE/tests/upstream_phys_gjk_cache_layout.cpp" -o build/upstream-phys-gjk-cache-layout-host.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" "${common[@]}" -c "$GITHUB_WORKSPACE/tests/upstream_phys_gjk_cache_layout.cpp" -o build/upstream-phys-gjk-cache-layout-android.o
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-phys-gjk-cache-layout-android.o)"
          printf '%s\\n' "$header" | grep -E 'Class:|Machine:'
          printf '%s\\n' "$header" | grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$'
          printf '%s\\n' "$header" | grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$'
      - name: Compile variadic iassert compatibility in host and Android DEBUG/Release modes
        run: |
          common=(
            -std=c++20 -fdeclspec
            -include "$GITHUB_WORKSPACE/tests/upstream_msvc_compat.h"
            -I build/upstream -I build/upstream/src
          )
          clang++ "${common[@]}" -D_DEBUG -c tests/upstream_iassert_variadic.cpp -o build/upstream-iassert-debug-host.o
          clang++ "${common[@]}" -c tests/upstream_iassert_variadic.cpp -o build/upstream-iassert-release-host.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" "${common[@]}" -D_DEBUG -c tests/upstream_iassert_variadic.cpp -o build/upstream-iassert-debug-android.o
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" "${common[@]}" -c tests/upstream_iassert_variadic.cpp -o build/upstream-iassert-release-android.o
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-iassert-debug-android.o)"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          printf '%s\n' "$header" | grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$'
          printf '%s\n' "$header" | grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$'
      - name: Diagnose complete KisakBlack Android target (non-blocking)
        shell: bash
        run: |
          set -uo pipefail
          log="$GITHUB_WORKSPACE/build/upstream-android-root-diagnostic.log"
          mkdir -p build/upstream-root-android
          : > "$log"

          set +e
          cmake -S build/upstream -B build/upstream-root-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS="-fdeclspec -include $GITHUB_WORKSPACE/tests/upstream_msvc_compat.h" 2>&1 | tee -a "$log"
          configure_rc=${PIPESTATUS[0]}
          set -e
          printf 'ROOT_CONFIGURE_EXIT=%s\n' "$configure_rc" | tee -a "$log"

          if [ "$configure_rc" -eq 0 ]; then
            set +e
            timeout 180s cmake --build build/upstream-root-android --target KisakBlack --parallel 2 \
              2>&1 | tee -a "$log"
            build_rc=${PIPESTATUS[0]}
            set -e
            printf 'ROOT_BUILD_EXIT=%s\n' "$build_rc" | tee -a "$log"
            if [ "$build_rc" -ne 0 ]; then
              echo "::warning::Full KisakBlack Android target did not build; diagnostic log uploaded."
            fi
          else
            echo "::warning::Full KisakBlack Android root configure failed; diagnostic log uploaded."
          fi
          tail -n 100 "$log"
      - name: Upload full-engine Android diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: kisakblack-android-root-diagnostic
          path: build/upstream-android-root-diagnostic.log
          if-no-files-found: warn
      - name: Upload upstream Android regression binaries
        uses: actions/upload-artifact@v6
        with:
          name: nuke-upstream-regression-arm64
          path: |
            build/upstream-bitarray-android
            build/upstream-atomic-android
            build/upstream-bd-reference-android
            build/upstream-bd-bytebuffer-length-android
            build/upstream-bd-platform-mutex-android
            build/upstream-snapfloat-rounding-android
            build/upstream-msvc-extensions-android.o
            build/upstream-auto-activate-layout-android.o
            build/upstream-phys-collision-pair-layout-android.o
            build/upstream-snd-dsp-types-android.o
            build/upstream-iassert-debug-android.o
            build/upstream-thread-android-cmake/nuke-upstream-thread-compat-test
            build/upstream-base64-android-cmake/nuke-upstream-base64-test
            build/nuke-upstream-angle-vectors-android.o
            build/nuke-upstream-axis-to-quat-android.o
            build/upstream-angle-android/nuke-upstream-angle-vectors-test
            build/upstream-angle-android/nuke-upstream-fileaccess-test
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify workflow template parity
        run: cmp --silent .github/workflows/android-arm64.yml ci/android-arm64.workflow-template.yml
      - run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure
