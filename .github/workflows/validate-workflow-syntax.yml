name: Validate workflow syntax

on:
  push:
    branches:
      - ci/diagnose-kisakblack-android-root-20261030
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@latest
      - name: Validate Android bootstrap workflow
        run: |
          "$HOME/go/bin/actionlint" .github/workflows/android-arm64.yml
