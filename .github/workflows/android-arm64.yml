name: ARM64 bootstrap
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure with Android NDK
        run: |
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile AArch64 smoke binaries
        run: cmake --build build/android --verbose
      - name: Verify ELF architecture
        run: |
          for binary in nuke-platform-probe nuke-atomic-test; do
            path="build/android/$binary"
            file "$path"
            header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$path")"
            printf '%s\n' "$header" | grep -E 'Class:|Machine:'
            if ! grep -qE '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*
          done
      - uses: actions/upload-artifact@v6
        with:
          name: nuke-android-aarch64-smoke-binaries
          path: |
            build/android/nuke-platform-probe
            build/android/nuke-atomic-test
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure
 <<< "$header"; then
              echo "Expected ELF64 output: $path" >&2
              exit 1
            fi
            if ! grep -qE '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*
          done
      - uses: actions/upload-artifact@v6
        with:
          name: nuke-android-aarch64-smoke-binaries
          path: |
            build/android/nuke-platform-probe
            build/android/nuke-atomic-test
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure
 <<< "$header"; then
              echo "Expected AArch64 machine: $path" >&2
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v6
        with:
          name: nuke-android-aarch64-smoke-binaries
          path: |
            build/android/nuke-platform-probe
            build/android/nuke-atomic-test
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure
