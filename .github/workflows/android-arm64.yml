name: ARM64 bootstrap
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure with Android NDK
        run: |
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
      - name: Compile AArch64 smoke binaries
        run: cmake --build build/android --verbose
      - name: Verify ELF architecture
        run: |
          for binary in nuke-platform-probe nuke-atomic-test; do
            path="build/android/$binary"
            file "$path"
            header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$path")"
            printf '%s\n' "$header" | grep -E 'Class:|Machine:'
            grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected ELF64 output: $path" >&2; exit 1; }
            grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected AArch64 machine: $path" >&2; exit 1; }
          done
      - uses: actions/upload-artifact@v6
        with:
          name: nuke-android-aarch64-smoke-binaries
          path: |
            build/android/nuke-platform-probe
            build/android/nuke-atomic-test
  upstream-patch-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Checkout pinned KisakBlack source
        uses: actions/checkout@v5
        with:
          repository: SwagSoftware/KisakBlack
          ref: 306bb14a8e052a6244bd1df4e4df7d8504c04ef4
          path: build/upstream
          persist-credentials: false
      - name: Verify portability patches apply cleanly
        run: |
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/0001-fix-aarch64-bitarray-varargs.patch"
          git -C build/upstream apply "$GITHUB_WORKSPACE/patches/0001-fix-aarch64-bitarray-varargs.patch"
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/0002-port-physics-win32-atomics.patch"
          git -C build/upstream apply "$GITHUB_WORKSPACE/patches/0002-port-physics-win32-atomics.patch"
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/0003-port-threading-win32-apis.patch"
          git -C build/upstream apply "$GITHUB_WORKSPACE/patches/0003-port-threading-win32-apis.patch"
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/0004-posix-random-name.patch"
          git -C build/upstream apply "$GITHUB_WORKSPACE/patches/0004-posix-random-name.patch"
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/0005-fix-angle-axis-row-index.patch"
          git -C build/upstream apply "$GITHUB_WORKSPACE/patches/0005-fix-angle-axis-row-index.patch"
          git -C build/upstream apply --check "$GITHUB_WORKSPACE/patches/0006-fix-axis-to-quat-row-index.patch"
          git -C build/upstream apply "$GITHUB_WORKSPACE/patches/0006-fix-axis-to-quat-row-index.patch"
          test -f build/upstream/src/nuke/win_thread_compat.h
          grep -q '#include <nuke/win_thread_compat.h>' build/upstream/tl/base/tl_thread.h
          grep -q 'inline std::uint32_t GetCurrentThreadId' build/upstream/src/nuke/win_thread_compat.h
          grep -q 'inline int SwitchToThread' build/upstream/src/nuke/win_thread_compat.h
          test -f build/upstream/src/nuke/win_atomic_compat.h
          grep -q '#include <nuke/win_atomic_compat.h>' build/upstream/src/physics/phys_local.h
          grep -q 'inline LONG _InterlockedExchangeAdd' build/upstream/src/nuke/win_atomic_compat.h
          grep -q 'inline LONGLONG _InterlockedCompareExchange64' build/upstream/src/nuke/win_atomic_compat.h
          grep -q 'inline LONG _InterlockedDecrement' build/upstream/src/nuke/win_atomic_compat.h
          grep -q 'inline LONG InterlockedExchange(' build/upstream/src/nuke/win_atomic_compat.h
          grep -q 'double __cdecl Com_Random();' build/upstream/src/universal/com_math.h
          grep -q '#define random Com_Random' build/upstream/src/universal/com_math.h
          grep -Fq 'right[0] = axis[1][0];' build/upstream/src/universal/com_math_anglevectors.cpp
          grep -Fq 'right[1] = axis[1][1];' build/upstream/src/universal/com_math_anglevectors.cpp
          grep -Fq 'right[2] = axis[1][2];' build/upstream/src/universal/com_math_anglevectors.cpp
          grep -Fq 'test[0][0] = (float)mat[1][2]' build/upstream/src/universal/com_math.cpp
          grep -Fq 'test[0][0] = (float)mat[1][2]' build/upstream/src/ik/ik_math.cpp
      - name: Compile and run patched bitarray regression
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror \
            -I "$GITHUB_WORKSPACE/tests/upstream-stubs" \
            -I "$GITHUB_WORKSPACE/build/upstream/src" \
            "$GITHUB_WORKSPACE/tests/upstream_bitarray.cpp" \
            -o build/upstream-bitarray-host
          ./build/upstream-bitarray-host
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++17 -Wall -Wextra -Werror \
            -I "$GITHUB_WORKSPACE/tests/upstream-stubs" \
            -I "$GITHUB_WORKSPACE/build/upstream/src" \
            "$GITHUB_WORKSPACE/tests/upstream_bitarray.cpp" \
            -o build/upstream-bitarray-android
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-bitarray-android)"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected patched bitarray test to be ELF64" >&2; exit 1; }
          grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected patched bitarray test to be AArch64" >&2; exit 1; }
      - name: Compile and run patched atomic regression
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -I "$GITHUB_WORKSPACE/build/upstream/src" \
            "$GITHUB_WORKSPACE/tests/atomic_compat.cpp" \
            -o build/upstream-atomic-host
          ./build/upstream-atomic-host
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++17 -Wall -Wextra -Werror -pthread \
            -I "$GITHUB_WORKSPACE/build/upstream/src" \
            "$GITHUB_WORKSPACE/tests/atomic_compat.cpp" \
            -o build/upstream-atomic-android
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-atomic-android)"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected patched atomic test to be ELF64" >&2; exit 1; }
          grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected patched atomic test to be AArch64" >&2; exit 1; }
      - name: Compile and run patched threading regression
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror -pthread \
            -I "$GITHUB_WORKSPACE/build/upstream" \
            -I "$GITHUB_WORKSPACE/build/upstream/src" \
            "$GITHUB_WORKSPACE/tests/upstream_thread_compat.cpp" \
            -o build/upstream-thread-host
          ./build/upstream-thread-host
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++" \
            -std=c++17 -Wall -Wextra -Werror -pthread \
            -I "$GITHUB_WORKSPACE/build/upstream" \
            -I "$GITHUB_WORKSPACE/build/upstream/src" \
            "$GITHUB_WORKSPACE/tests/upstream_thread_compat.cpp" \
            -o build/upstream-thread-android
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-thread-android)"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected patched threading test to be ELF64" >&2; exit 1; }
          grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected patched threading test to be AArch64" >&2; exit 1; }
      - name: Configure upstream Base64 host target
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B build/upstream-base64-host -G Ninja \
            -DNUKE_BUILD_UPSTREAM_BASE64_TEST=ON \
            -DNUKE_UPSTREAM_SOURCE_DIR="$GITHUB_WORKSPACE/build/upstream" \
            -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build and run upstream Base64 host target
        run: |
          cmake --build build/upstream-base64-host --target nuke-upstream-base64-test
          ctest --test-dir build/upstream-base64-host -R '^upstream-base64-roundtrip$' --output-on-failure
      - name: Configure upstream Base64 Android target
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B build/upstream-base64-android-cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DNUKE_BUILD_UPSTREAM_BASE64_TEST=ON \
            -DNUKE_UPSTREAM_SOURCE_DIR="$GITHUB_WORKSPACE/build/upstream" \
            -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build and verify upstream Base64 Android target
        run: |
          cmake --build build/upstream-base64-android-cmake --target nuke-upstream-base64-test
          header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h build/upstream-base64-android-cmake/nuke-upstream-base64-test)"
          printf '%s\n' "$header" | grep -E 'Class:|Machine:'
          grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected upstream Base64 regression to be ELF64" >&2; exit 1; }
          grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected upstream Base64 regression to be AArch64" >&2; exit 1; }
      - name: Configure upstream angle/vector host target
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B build/upstream-angle-host -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DNUKE_BUILD_UPSTREAM_ANGLE_VECTORS=ON \
            -DNUKE_UPSTREAM_SOURCE_DIR="$GITHUB_WORKSPACE/build/upstream" \
            -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Compile upstream angle/vector and quaternion host objects
        run: cmake --build build/upstream-angle-host --target nuke-upstream-angle-vectors nuke-upstream-axis-to-quat --verbose
      - name: Configure upstream angle/vector Android target
        run: |
          cmake -S "$GITHUB_WORKSPACE" -B build/upstream-angle-android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DNUKE_BUILD_UPSTREAM_ANGLE_VECTORS=ON \
            -DNUKE_UPSTREAM_SOURCE_DIR="$GITHUB_WORKSPACE/build/upstream" \
            -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Compile and verify upstream angle/vector Android object
        run: |
          cmake --build build/upstream-angle-android --target nuke-upstream-angle-vectors nuke-upstream-axis-to-quat --verbose
          for target in nuke-upstream-angle-vectors nuke-upstream-axis-to-quat; do
            object="$(find "build/upstream-angle-android/CMakeFiles/$target.dir" -name '*.o' -print -quit)"
            test -n "$object"
            output="build/$target-android.o"
            cp "$object" "$output"
            header="$("$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -h "$output")"
            printf '%s\n' "$header" | grep -E 'Class:|Machine:'
            grep -Eq '^[[:space:]]*Class:[[:space:]]+ELF64[[:space:]]*$' <<< "$header" || { echo "Expected $target object to be ELF64" >&2; exit 1; }
            grep -Eq '^[[:space:]]*Machine:[[:space:]]+AArch64[[:space:]]*$' <<< "$header" || { echo "Expected $target object to be AArch64" >&2; exit 1; }
          done
      - name: Upload upstream Android regression binaries
        uses: actions/upload-artifact@v6
        with:
          name: nuke-upstream-regression-arm64
          path: |
            build/upstream-bitarray-android
            build/upstream-atomic-android
            build/upstream-thread-android
            build/upstream-base64-android-cmake/nuke-upstream-base64-test
            build/nuke-upstream-angle-vectors-android.o
            build/nuke-upstream-axis-to-quat-android.o
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/host
      - run: ctest --test-dir build/host --output-on-failure
