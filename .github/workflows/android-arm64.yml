name: NUKE ARM64 Android compilation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  android-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SwagSoftware/KisakBlack
          ref: 306bb14a8e052a6244bd1df4e4df7d8504c04ef4
          path: upstream/KisakBlack
      - name: Android AArch64 configure
        run: |
          cmake -S . -B build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON \
            -DNUKE_KISAKBLACK_ROOT="$GITHUB_WORKSPACE/upstream/KisakBlack"
      - name: Compile upstream and portability targets
        run: cmake --build build/android --verbose
      - name: Verify AArch64 ELF outputs
        run: |
          llvm-readelf -h build/android/nuke-platform-probe | grep -q 'AArch64'
          llvm-readelf -h build/android/nuke-base64-smoke | grep -q 'AArch64'
          llvm-readelf -h build/android/nuke-atomic-test | grep -q 'AArch64'
      - uses: actions/upload-artifact@v4
        with:
          name: nuke-aarch64-integration-probes
          path: |
            build/android/nuke-platform-probe
            build/android/nuke-base64-smoke
            build/android/nuke-atomic-test
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SwagSoftware/KisakBlack
          ref: 306bb14a8e052a6244bd1df4e4df7d8504c04ef4
          path: upstream/KisakBlack
      - run: cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DNUKE_KISAKBLACK_ROOT="$GITHUB_WORKSPACE/upstream/KisakBlack"
      - run: cmake --build build/host --verbose
      - run: ctest --test-dir build/host --output-on-failure
