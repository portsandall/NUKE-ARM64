plugins { id 'com.android.application' }
android {
    namespace 'org.bitflipunix.nuke'
    compileSdk 35
    defaultConfig {
        applicationId 'org.bitflipunix.nuke'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1.0-poc'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DNUKE_KISAKBLACK_ROOT=' + (System.getenv('NUKE_KISAKBLACK_ROOT') ?: '') } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt' } }
    buildTypes { release { minifyEnabled false } }
}
